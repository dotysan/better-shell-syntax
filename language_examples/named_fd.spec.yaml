- source: '#!/bin/bash'
  scopes:
    - comment.line.number-sign
    - meta.shebang
    - punctuation.definition.comment.shebang
- source: '#'
  scopesBegin:
    - comment.line.number-sign
  scopes:
    - punctuation.definition.comment
- source: ' Test named file descriptors (bash 4.1+)'
  scopesEnd:
    - comment.line.number-sign
- source: function
  scopesBegin:
    - meta.function
  scopes:
    - storage.type.function
- source: test_named_fd
  scopes:
    - entity.name.function
- source: '{'
  scopesBegin:
    - meta.function.body
  scopes:
    - punctuation.definition.group
    - punctuation.section.function.definition
- source: exec
  scopesBegin:
    - meta.statement
    - meta.statement.command
  scopes:
    - meta.statement.command.name
    - entity.name.function.call
    - entity.name.command
    - support.function.builtin
- source: '{logfd}>&-'
  scopes:
    - meta.argument
    - keyword.operator.redirect
  scopesEnd:
    - meta.statement
    - meta.statement.command
- source: echo
  scopesBegin:
    - meta.statement
    - meta.statement.command
  scopes:
    - meta.statement.command.name
    - entity.name.function.call
    - entity.name.command
    - support.function.builtin
- source: '"'
  scopesBegin:
    - meta.argument
    - string.quoted.double
  scopes:
    - punctuation.definition.string.begin
- source: Done
- source: '"'
  scopes:
    - punctuation.definition.string.end
  scopesEnd:
    - meta.statement
    - meta.statement.command
    - meta.argument
    - string.quoted.double
- source: '}'
  scopes:
    - punctuation.definition.group
    - punctuation.section.function.definition
  scopesEnd:
    - meta.function
    - meta.function.body
